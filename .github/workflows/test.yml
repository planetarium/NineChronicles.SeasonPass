name: Test
# Unit tests on every PR and on main. The previous test.yml was a workflow_call that
# nothing called (and still pointed at the old common/ layout), so no tests ran in CI.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          # apps/api/tests/conftest.py connects to postgres:postgres@localhost:5432/season_pass_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: season_pass_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: api-venv-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock', 'apps/shared/**/*.py', 'apps/shared/pyproject.toml') }}
      - run: poetry install --no-interaction
      - name: pytest
        run: poetry run python -m pytest tests -q

  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: apps/shared/.venv
          key: shared-venv-${{ runner.os }}-${{ hashFiles('apps/shared/poetry.lock') }}
      - run: poetry install --no-interaction
      - name: pytest
        run: poetry run python -m pytest tests -q

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/worker
    env:
      # Settings requires it; tests mock Account so KMS is never called. Dummy AWS
      # credentials make sure an unmocked call fails instead of reaching AWS.
      WORKER_KMS_KEY_ID: test-key
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: apps/worker/.venv
          key: worker-venv-${{ runner.os }}-${{ hashFiles('apps/worker/poetry.lock', 'apps/shared/**/*.py', 'apps/shared/pyproject.toml') }}
      - run: poetry install --no-interaction
      - name: pytest
        run: poetry run python -m pytest tests -q

  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/tracker
    env:
      TRACKER_ARENA_SERVICE_JWT_PUBLIC_KEY: dGVzdA==  # required by Settings; tests patch a real key in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: apps/tracker/.venv
          key: tracker-venv-${{ runner.os }}-${{ hashFiles('apps/tracker/poetry.lock', 'apps/shared/**/*.py', 'apps/shared/pyproject.toml') }}
      - run: poetry install --no-interaction
      - name: pytest
        run: poetry run python -m pytest tests -q
